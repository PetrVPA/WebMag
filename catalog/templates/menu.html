<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">Оружейный барон</h5>
    <nav class="ms-5">
        <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:home' %}">Каталог</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:contacts' %}">Контакты</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'blog:blog_start' %}">Личный блог</a>
        {% if user.is_authenticated %}
             <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:product_create'%}">Создать товар</a>
        {% else %}
        {% endif %}
        {% if user.is_authenticated %}
            <form method="post" action="{% url 'login:logout' %}" style="display: inline;">
	                        {% csrf_token %}
	                        <button type="submit" class="p-2 btn btn-outline-primary">Выйти</button>
            </form>

        {% else %}
            <a class="p-2 btn btn-outline-primary" href="{% url 'login:login'%}">Войти</a>
            <a class="p-2 btn btn-outline-primary" href="{% url 'login:register'%}">Регистрация</a>
        {% endif %}
    </nav>
</div>
