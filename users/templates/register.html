{% extends 'product_base.html' %}

{% block content %}
<div class="container">
  <div class="row">
    <div class="col">
      <form class="row" method="post" enctype="multipart/form-data">
        <div class="card">
          <div class="card-body">
            <h2>Регистрация</h2>
                <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
                </form>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
