{% extends 'base_blog.html' %}



 {% block content %}
        {% for blog in blog_list %}

                <a href="{% url 'blog:blog_edit_article' blog.id %}" class="btn btn-secondary">Редактировать</a>
                <a href="{% url 'blog:blog_delete_article' blog.id %}" class="btn btn-danger">Удалить</a>

                <div>
                     <h1 class="card-title pricing-card-title">{{blog.title_article}}</h1>
                </div>

                <div class="card-header">
                   {% if blog.preview %}
                        <img src="{{ blog.preview.url }}" class="img-fluid" style="height: 200px;" alt="{{ blog.preview }}">
                   {% else %}
                        <p>Изображение отсутствует</p>
                   {% endif %}
                </div>
                <div>
                    <p>{{ blog.content }}</p>

                    <a href="{% url 'blog:blog_article' blog.id %}">Читать далее</a>


                </div>

        {% endfor %}

 {% endblock %}
